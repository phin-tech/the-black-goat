name: Build and push images

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Application image (ingest edge + absurd worker share this).
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/phin-tech/the-black-goat:${{ github.sha }}

      # Postgres image with the schema baked in.
      - name: Build and push postgres image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.postgres
          push: true
          tags: ghcr.io/phin-tech/the-black-goat-postgres:${{ github.sha }}
