# Postgres for absurd (durable task execution).
# Connect via:
#   ABSURD_DATABASE_URL=postgresql://absurd:absurd@localhost:5432/absurd

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: absurd
      POSTGRES_USER: absurd
      POSTGRES_PASSWORD: absurd
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U absurd -d absurd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
