[project]
name = "the-black-goat-memory"
version = "0.1.0"
description = "Postgres-backed key/value memory plugin for the-black-goat."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "the-black-goat",
    "psycopg[binary]>=3.0.0",
    "pydantic>=2.13.3",
]

[project.entry-points."the_black_goat"]
memory = "memory_plugin"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "memory_plugin"

[tool.uv.sources]
the-black-goat = { workspace = true }
