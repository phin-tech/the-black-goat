[project]
name = "the-black-goat-stdlib"
version = "0.1.0"
description = "Baseline tools for the-black-goat (now / sleep / echo)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "the-black-goat",
    "pydantic>=2.13.3",
]

[project.entry-points."the_black_goat"]
stdlib = "stdlib_plugin"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stdlib_plugin"

[tool.uv.sources]
the-black-goat = { workspace = true }
